# Java Gradle CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
version: 2.1
jobs:
  build:
    docker:
    # specify the version you desire here
    - image: rocker/verse:4.3.3
    # service containers share localhost with the build container
    - image: datashield/armadillo_citest:latest
      environment:
        LOGGING_CONFIG: 'classpath:logback-file.xml'
        AUDIT_LOG_PATH: '/app/logs/audit.log'
        SPRING_SECURITY_USER_PASSWORD: 'admin'
        DEBUG: "FALSE"
        SPRING_APPLICATION_JSON: |
          {
            "armadillo": {
              "docker-management-enabled": false,
              "profiles": [{
                "name": "default",
                "image": "datashield/rock-base:latest",
                "host": "localhost",
                "port": 8085,
                "package-whitelist": ["dsBase", "dsTidyverse"],
                "function-blacklist": [],
                "options": {"datashield": {"seed": 342325352}}
              }]
            },
            "spring": {
              "security": {"user": {"name": "admin", "password": "admin"}},
              "servlet": {"multipart": {"max-file-size": "1000MB", "max-request-size": "1000MB"}}
            },
            "storage": {"root-dir": "/data"},
            "audit.log.path": "/logs/audit.log",
            "stdout.log.path": "/logs/armadillo.log"
          }
    - image: datashield/rock-base:latest
      environment:
        DEBUG: "FALSE"
    working_directory: ~/repo

    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: large

    steps:
    - checkout

    - run:
        name: Prepare environment
        command: |
          apt-get update
          apt-get install git curl ssh libcurl4-openssl-dev libssl-dev build-essential ninja-build cmake jq -y
          git fetch --all --tags
          git remote set-url origin https://${GITHUB_TOKEN}@github.com/molgenis/ds-tidyverse-client.git

    - run:
        name: Install git semantic version bump tool
        command: |
          echo 'deb [trusted=yes] https://apt.fury.io/caarlos0/ /' | sudo tee /etc/apt/sources.list.d/caarlos0.list
          sudo apt update
          sudo apt install svu

    - run:
        name: Get new version number based on semantic commits and put in package description
        command: |
          Rscript -e 'install.packages("git2r")'
          Rscript -e "git2r::config(user.email = 'molgenis+ci@gmail.com', user.name = 'MOLGENIS Jenkins')"
          export VERSION=$(svu next --tag.prefix="")
          install2.r --repo https://cloud.r-project.org desc
          Rscript -e "desc::desc_set_version('${VERSION}')"

    # we use version number for caching
    - restore_cache:
        keys:
        - when-{{ .Environment.CIRCLE_PULL_REQUEST }}-{{ checksum "DESCRIPTION" }}

    - run:
        name: Install R deps takes 15min, but no worries we skipinstalled from cache when this PR has installed them before
        command: |
          Rscript -e 'install.packages(c("knitr", "devtools", "pkgdown", "markdown", "rmarkdown", "rlang", "stringr", "cli", "covr", "git2r", "DSI", "assertthat", "purrr", "gridExtra", "DSLite", "RANN", "lme4", "reshape2", "polycor", "gamlss", "gamlss", "mice", "childsds", "fields", "metafor", "meta", "panelaggregation", "testthat", "MolgenisArmadillo", "DSMolgenisArmadillo", "dsBase", "dsBaseClient"), repos = "https://cloud.r-project.org")'
          Rscript -e "git2r::config(user.email = 'molgenis+ci@gmail.com', user.name = 'MOLGENIS Jenkins')"
          if [ "$CIRCLE_BRANCH" != "master" ] && git ls-remote --heads https://github.com/molgenis/ds-tidyverse | grep "refs/heads/$CIRCLE_BRANCH"; then
            Rscript -e "remotes::install_git('git@github.com:molgenis/ds-tidyverse.git', ref = '${CIRCLE_BRANCH}')"
          else
            Rscript -e 'remotes::install_git("git@github.com:molgenis/ds-tidyverse.git")'
          fi

    - save_cache:
        paths:
        - /usr/local/lib/R/library
        - /usr/local/lib/R/site-library
        - /tmp/downloaded_packages
        key: when-{{ .Environment.CIRCLE_PULL_REQUEST }}-{{ checksum "DESCRIPTION" }}

    - run:
        name: Build and check artifacts
        command: |
          export PACKAGE=`grep Package DESCRIPTION | head -n1 | cut -d':' -f2 | xargs`
          export TAG=`grep Version DESCRIPTION | head -n1 | cut -d':' -f2 | xargs`
          echo "Testing ${PACKAGE}:${TAG}"
          Rscript -e 'devtools::check(remote=TRUE, force_suggests = FALSE, error_on="error", env_vars = c(R_CRAN_WEB = "https://cloud.r-project.org"))'
          Rscript -e 'library(covr);codecov()'
          R CMD build .
          Rscript -e "devtools::check_built(path = './${PACKAGE}_${TAG}.tar.gz', remote=TRUE, force_suggests = FALSE)"
          Rscript -e "devtools::build_site(examples = FALSE)"

    - run:
        name: Wait for Armadillo to be ready
        command: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Armadillo is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Armadillo did not become ready in time"
          exit 1

    - run:
        name: Upload test datasets to Armadillo
        command: |
          cd tests/testthat/data_files
          R -q -f molgenis_armadillo-upload_testing_datasets.R

    - run:
        name: Install dsBase and dsTidyverse to Armadillo
        command: |
          ref=master
          if [ "$CIRCLE_BRANCH" != "master" ] && git ls-remote --exit-code --heads https://github.com/molgenis/ds-tidyverse "$CIRCLE_BRANCH"; then
            ref="$CIRCLE_BRANCH"
          fi
          git clone --depth 1 --branch "$ref" https://github.com/molgenis/ds-tidyverse.git /tmp/ds-tidyverse

          mkdir /tmp/armadillo-packages
          cd /tmp/armadillo-packages
          R CMD build --no-build-vignettes /tmp/ds-tidyverse
          Rscript -e 'download.packages("dsBase", destdir = ".", type = "source", repos = "https://cloud.r-project.org")'

          for i in $(seq 1 30); do
            if Rscript -e '
              MolgenisArmadillo::armadillo.login_basic("http://localhost:8080", "admin", "admin")
              MolgenisArmadillo::armadillo.install_packages(
                c(Sys.glob("dsBase_*.tar.gz"), Sys.glob("dsTidyverse_*.tar.gz")),
                profile = "default"
              )
            '; then
              exit 0
            fi
            sleep 10
          done
          echo "Package install failed (default profile may not have started in time)"
          exit 1

    - run:
        name: Verify and whitelist the Armadillo packages
        command: |
          check_version() {
            for i in $(seq 1 30); do
              actual=$(curl -sf -u admin:admin http://localhost:8080/packages | jq -r ".[] | select(.name == \"$1\") | .version" || true)
              if [ "$actual" == "$2" ]; then
                echo "Installed $1 $actual"
                return 0
              fi
              sleep 10
            done
            echo "$1 version mismatch: expected $2, found '$actual'"
            return 1
          }
          check_version dsBase "$(basename /tmp/armadillo-packages/dsBase_*.tar.gz .tar.gz | cut -d'_' -f2)"
          check_version dsTidyverse "$(sed -n 's/^Version: //p' /tmp/ds-tidyverse/DESCRIPTION | tr -d '\r')"
          curl -fsS -u admin:admin -X POST http://localhost:8080/whitelist/dsBase
          curl -fsS -u admin:admin -X POST http://localhost:8080/whitelist/dsTidyverse

    - run:
        name: Run tests against Armadillo
        environment:
          TESTTHAT_MAX_FAILS: 999999
        command: |
          Rscript -e 'options(default_driver = "ArmadilloDriver"); devtools::test(stop_on_failure = TRUE)'

    - run:
        name: If on master and significant commits then release to github and message slack
        command: |
          export PACKAGE=`grep Package DESCRIPTION | head -n1 | cut -d':' -f2 | xargs`
          export TAG=`grep Version DESCRIPTION | head -n1 | cut -d':' -f2 | xargs`
          export PREVIOUS=$(git tag -l --sort -version:refname | head -n 1)
          export NEXT="v${TAG}"
          echo "NEXT=${NEXT} and PREVIOUS=${PREVIOUS}"
          mkdir build
          cp ${PACKAGE}_${TAG}.tar.gz build/.

          if [  $CIRCLE_BRANCH = "master" ] && [ $PREVIOUS != $NEXT  ]; then
            echo "Releasing ${PACKAGE}:${TAG}, pushing to git"

            git commit -a -m 'Increment DESCRIPTION number'
            git tag v${TAG}
            git push --tags origin master

            response=$(curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/molgenis/ds-tidyverse-client/releases \
            -d "{\"tag_name\":\"${NEXT}\",\"target_commitish\":\"master\",\"name\":\"${NEXT}\",\"draft\":false,\"prerelease\":false,\"generate_release_notes\":true}")

            RELEASE_ID=$(echo "$response" | jq -r .id)
            echo "Created release $RELEASE_ID"

            curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/molgenis/ds-tidyverse-client/releases/${RELEASE_ID}/assets?name=${PACKAGE}_${TAG}.tar.gz" \
            --data-binary "@${PACKAGE}_${TAG}.tar.gz"

            Rscript -e "usethis::use_pkgdown_github_pages()"

            curl -d "token=${SLACK_TOKEN}" \
            -d "text=:ds-tidyverse-client: ds-tidyverse-client version: v${TAG} is released :rocket:" \
            -d "channel=C03AAGBH3PC" \
            -X POST https://slack.com/api/chat.postMessage

          elif [ $CIRCLE_BRANCH = "master" ] && [ $PREVIOUS = $NEXT ]; then
            echo "skipping release, no significant commits, version is still $TAG"

            curl -d "token=${SLACK_TOKEN}" \
            -d "text=:ds-tidyverse-client: ds-tidyverse-client master build success :thumbsup:, no release because no significant commits added." \
            -d "channel=C0639V5KTCY" \
            -X POST https://slack.com/api/chat.postMessage
          else
            echo "skipping release, we are not on master branch"

            curl -d "token=${SLACK_TOKEN}" \
            -d "text=:ds-tidyverse-client: *<${CIRCLE_PULL_REQUEST}|Circle-CI » Armadillo » ds-tidyverse-client » PR-${CIRCLE_PULL_REQUEST##*/} #${CIRCLE_BUILD_NUM}>*" \
            -d "channel=C0639V5KTCY" \
            -X POST https://slack.com/api/chat.postMessage
          fi

    - store_artifacts:
        path: build
