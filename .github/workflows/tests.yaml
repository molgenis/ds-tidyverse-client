name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dslite-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Choose dsTidyverse branch
        id: ds-tidyverse-ref
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/molgenis/ds-tidyverse "$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            github::molgenis/ds-tidyverse@${{ steps.ds-tidyverse-ref.outputs.ref }}

      - name: Run tests on DSLite
        env:
          TESTTHAT_MAX_FAILS: 999999
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

  armadillo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Start Armadillo
        run: docker compose -f .github/armadillo/docker-compose.yml up -d

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools

      - name: Choose dsTidyverse branch
        id: ds-tidyverse-ref
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/molgenis/ds-tidyverse "$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out dsTidyverse
        uses: actions/checkout@v5
        with:
          repository: molgenis/ds-tidyverse
          ref: ${{ steps.ds-tidyverse-ref.outputs.ref }}
          path: ds-tidyverse

      - name: Build dsTidyverse tarball
        id: build-ds-tidyverse
        working-directory: ${{ runner.temp }}
        run: |
          R CMD build --no-build-vignettes "$GITHUB_WORKSPACE/ds-tidyverse"
          echo "tarball=$RUNNER_TEMP/$(ls dsTidyverse_*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Download dsBase tarball matching the CRAN dsBaseClient
        id: download-dsbase
        working-directory: ${{ runner.temp }}
        run: |
          Rscript -e 'download.packages("dsBase", destdir = ".", type = "source", repos = "https://cloud.r-project.org")'
          tarball=$(ls dsBase_*.tar.gz)
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$tarball" | sed -E 's/^dsBase_(.*)\.tar\.gz$/\1/')" >> "$GITHUB_OUTPUT"

      - name: Wait for Armadillo to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Armadillo is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Armadillo did not become ready in time"
          docker compose -f .github/armadillo/docker-compose.yml logs armadillo || true
          exit 1

      - name: Install test datasets to Armadillo
        working-directory: tests/testthat/data_files
        run: R -q -f molgenis_armadillo-upload_testing_datasets.R

      - name: Install dsBase and dsTidyverse to Armadillo
        run: |
          for i in $(seq 1 30); do
            if Rscript -e "
              MolgenisArmadillo::armadillo.login_basic('http://localhost:8080', 'admin', 'admin')
              MolgenisArmadillo::armadillo.install_packages(
                c('${{ steps.download-dsbase.outputs.tarball }}', '${{ steps.build-ds-tidyverse.outputs.tarball }}'),
                profile = 'default'
              )
            "; then
              exit 0
            fi
            sleep 10
          done
          echo "Package install via armadillo.install_packages() failed (default profile may not have started in time)"
          exit 1

      - name: Verify installed package versions
        run: |
          check_version() {
            for i in $(seq 1 30); do
              actual=$(curl -sf -u admin:admin http://localhost:8080/packages | jq -r ".[] | select(.name == \"$1\") | .version" || true)
              if [ "$actual" == "$2" ]; then
                echo "Installed $1 $actual"
                return 0
              fi
              sleep 10
            done
            echo "$1 version mismatch: expected $2, found '$actual'"
            return 1
          }
          check_version dsBase "${{ steps.download-dsbase.outputs.version }}"
          check_version dsTidyverse "$(sed -n 's/^Version: //p' ds-tidyverse/DESCRIPTION | tr -d '\r')"

      - name: Whitelist dsBase and dsTidyverse
        run: |
          curl -u admin:admin -X POST http://localhost:8080/whitelist/dsBase
          curl -u admin:admin -X POST http://localhost:8080/whitelist/dsTidyverse

      - name: Run tests against Armadillo
        env:
          TESTTHAT_MAX_FAILS: 999999
        run: Rscript -e 'options(default_driver = "ArmadilloDriver"); devtools::test(stop_on_failure = TRUE)'

      - name: Dump Armadillo log
        if: failure()
        run: docker compose -f .github/armadillo/docker-compose.yml logs armadillo
